name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # jsdom 30 (Vitest) needs Node ^22.22.2 || ^24 — Node 20 throws
          # markAsUncloneable / CacheStorage errors during worker startup.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Format (Prettier + Tailwind class order)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Showcase paths
        run: npm run check:showcase

      - name: Catalog integrity
        run: npm run check:catalog

      - name: Design guard
        run: npm run check:design

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: E2E smoke + a11y
        run: npm run test:e2e
