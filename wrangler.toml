# Workers static site — Next.js export in out/
#
# This project deploys to *.workers.dev (Worker + static assets), not Pages.
#
# Cloudflare dashboard — Builds & deployments:
#   Build command:    npm run build
#   Deploy command:   npm run pages:deploy
#   Version command:  exit 0
#   Output directory: out
#
# Do NOT use npx wrangler pages deploy (Pages API — wrong project type).
# Do NOT set CLOUDFLARE_API_TOKEN in Environment variables.

name = "opensourceui"
compatibility_date = "2025-08-27"
account_id = "aa80904ac82949fe89814f98b5a3894d"

[assets]
directory = "./out"
not_found_handling = "404-page"

# Cloudflare Workers Observability — off for now (Sentry covers app errors).
# Re-enable in the dashboard or set enabled = true if you want CF logs/traces.
[observability]
enabled = false
